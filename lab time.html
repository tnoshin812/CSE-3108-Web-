<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Lab Schedule</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .schedule {
            width: 750px;
            margin: auto;
            background-color: white;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #888;
            padding: 14px;
            text-align: center;
            font-size: 18px;
        }

        th {
            background-color: #eeeeee;
        }

        .semester {
            text-align: left;
            font-weight: bold;
            background-color: #fafafa;
        }
    </style>
</head>

<body>

    <div class="schedule">

        <h1>Weekly Lab Schedule</h1>

        <table>
            <tr>
                <th>Day</th>
                <th>09:00–11:00</th>
                <th>11:00–13:00</th>
            </tr>

            <tr>
                <td>Sunday</td>
                <td>Web Programming</td>
                <td>Data Structures</td>
            </tr>

            <tr>
                <td>Monday</td>
                <td>Algorithms</td>
                <td>Operating Systems</td>
            </tr>

            <tr>
                <td colspan="3" class="semester">
                    Semester: Summer 2026
                </td>
            </tr>
        </table>

    </div>

</body>
</html>
